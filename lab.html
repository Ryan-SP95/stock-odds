<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R Lab — TheOddsAlgo</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #08080f;
  --text: #e8e8f0;
  --muted: #44445a;
  --dim: #12121c;
  --border: #1a1a28;
  --green: #22c55e;
  --green-soft: rgba(34,197,94,0.08);
  --red-soft: rgba(239,68,68,0.08);
  --red: #ef4444;
  --mono: 'DM Mono', monospace;
  --sans: 'DM Sans', sans-serif;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ── WORDMARK ── */
#wordmark {
  position: fixed;
  top: 22px;
  left: 28px;
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  letter-spacing: 0.04em;
  text-decoration: none;
  z-index: 100;
  transition: color 0.2s;
  cursor: pointer;
}
#wordmark:hover { color: var(--text); }
#wordmark span { color: var(--green); }

/* ── ENGINE DOT ── */
#engineDot {
  position: fixed;
  top: 28px;
  right: 28px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--muted);
  z-index: 100;
  transition: background 0.4s, box-shadow 0.4s;
}
#engineDot.ready { background: var(--green); box-shadow: 0 0 8px rgba(34,197,94,0.4); }
#engineDot.err { background: #eab308; }

/* ── STAGE ── */
#stage {
  width: 100%;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 24px 60px;
}

/* ── PROBLEM ── */
#problem-wrap {
  width: 100%;
  max-width: 600px;
  margin-bottom: 28px;
  position: relative;
}

#problem-text {
  font-family: var(--sans);
  font-size: 17px;
  font-weight: 300;
  color: var(--text);
  line-height: 1.7;
  letter-spacing: -0.01em;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.35s ease, transform 0.35s ease;
}
#problem-text.visible {
  opacity: 1;
  transform: translateY(0);
}
#problem-text.fading {
  opacity: 0;
  transform: translateY(-5px);
}

/* inline code in problem */
#problem-text code {
  font-family: var(--mono);
  font-size: 14px;
  background: var(--dim);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 6px;
  color: var(--green);
}

/* ── EDITOR ── */
#editor-wrap {
  width: 100%;
  max-width: 600px;
  position: relative;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--dim);
  overflow: hidden;
  transition: border-color 0.3s, box-shadow 0.3s;
  opacity: 0;
  transform: translateY(8px);
  animation: editorReveal 0.4s 0.15s ease forwards;
}
@keyframes editorReveal {
  to { opacity: 1; transform: translateY(0); }
}
#editor-wrap.pass-flash {
  border-color: var(--green);
  box-shadow: 0 0 0 1px rgba(34,197,94,0.15), inset 0 0 40px rgba(34,197,94,0.04);
}
#editor-wrap.fail-flash {
  border-color: var(--red);
  box-shadow: 0 0 0 1px rgba(239,68,68,0.1);
}

#editor {
  width: 100%;
  min-height: 140px;
  max-height: 260px;
  background: transparent;
  color: var(--text);
  border: none;
  outline: none;
  padding: 16px 18px;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.7;
  resize: none;
  overflow-y: auto;
  caret-color: var(--green);
  display: block;
}
#editor::selection { background: rgba(34,197,94,0.12); }
#editor::-webkit-scrollbar { width: 2px; }
#editor::-webkit-scrollbar-thumb { background: var(--border); }

/* editor footer */
.editor-footer {
  display: flex;
  align-items: center;
  padding: 9px 14px;
  border-top: 1px solid var(--border);
  gap: 10px;
}

#runBtn {
  background: none;
  border: 1px solid var(--muted);
  border-radius: 5px;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  padding: 5px 14px;
  cursor: pointer;
  transition: all 0.15s;
}
#runBtn:hover:not(:disabled) { border-color: var(--green); color: var(--green); }
#runBtn:disabled { opacity: 0.3; cursor: not-allowed; }
#runBtn.running { border-color: var(--green); color: var(--green); opacity: 0.6; }

.kb { font-size: 10px; color: var(--muted); opacity: 0.5; }
/* ── OUTPUT ── */
#output-area {
  width: 100%;
  max-width: 600px;
  margin-top: 10px;
  min-height: 22px;
}
#output-line {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--muted);
  line-height: 1.6;
  white-space: pre-wrap;
  opacity: 0;
  transition: opacity 0.2s ease;
}
#output-line.visible { opacity: 1; }
#output-line.is-error { color: #6b3333; }
#commentary-line {
  font-family: var(--mono);
  font-size: 11px;
  color: #2a2a3f;
  margin-top: 6px;
  line-height: 1.5;
  opacity: 0;
  transition: opacity 0.3s ease;
  font-style: italic;
}
#commentary-line.visible { opacity: 1; color: #383858; }


/* ── HINT (inline, below output) ── */
#hint-line {
  width: 100%;
  max-width: 600px;
  margin-top: 10px;
  opacity: 0;
  transition: opacity 0.4s;
  pointer-events: none;
}
#hint-line.visible { opacity: 1; pointer-events: auto; }
#hint-toggle {
  background: none;
  border: none;
  font-family: var(--mono);
  font-size: 10px;
  color: #2a2a3f;
  cursor: pointer;
  padding: 0;
  letter-spacing: 0.06em;
  transition: color 0.15s;
}
#hint-toggle:hover { color: var(--muted); }
#hint-toggle.open { color: #a07b10; }
#hint-text {
  font-size: 11px;
  color: #3a3520;
  line-height: 1.6;
  margin-top: 5px;
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.25s ease, opacity 0.25s;
  opacity: 0;
}
#hint-text.open { max-height: 100px; opacity: 1; }

/* ── CHEATSHEET ── */
#cheat-panel {
  position: fixed;
  top: 50%;
  right: 0;
  transform: translateY(-50%);
  width: 160px;
  background: #0d0d1a;
  border-left: 1px solid var(--border);
  padding: 14px;
  z-index: 50;
  transition: right 0.25s ease;
}
#cheat-panel.hidden { right: -160px; }
#cheat-label {
  font-size: 8px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #252538;
  margin-bottom: 10px;
  font-family: var(--sans);
}
.cheat-fn {
  display: block;
  font-size: 11px;
  color: #2a2a3f;
  padding: 3px 0;
  cursor: pointer;
  border: none;
  background: none;
  font-family: var(--mono);
  text-align: left;
  width: 100%;
  transition: color 0.15s;
  letter-spacing: 0;
}
.cheat-fn:hover { color: var(--green); }
#cheat-tab {
  position: fixed;
  top: 50%;
  right: 0;
  transform: translateY(-50%);
  width: 16px;
  height: 36px;
  background: #0d0d1a;
  border: 1px solid var(--border);
  border-right: none;
  border-radius: 4px 0 0 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 51;
  font-size: 8px;
  color: #252538;
  transition: right 0.25s ease, color 0.15s;
  user-select: none;
}
#cheat-tab:hover { color: var(--muted); }

/* ── TICKER ── */
#ticker {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 28px;
  border-top: 1px solid var(--border);
  overflow: hidden;
  display: flex;
  align-items: center;
  background: var(--bg);
  z-index: 40;
}
#ticker-track {
  display: flex;
  white-space: nowrap;
  animation: tickScroll 30s linear infinite;
}
#ticker-track:hover { animation-play-state: paused; }
@keyframes tickScroll {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
.tick-item {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 0 20px;
  font-size: 10px;
  color: #1a1a2e;
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.15s;
}
.tick-item:hover { color: #2e2e4a; }
.tick-fn { font-family: var(--mono); }
.tick-sep { display: inline-block; width: 1px; height: 8px; background: var(--border); vertical-align: middle; }
.tick-desc { font-family: var(--sans); font-weight: 300; }

/* ── COUNTER (hidden, reveals at end) ── */
#counter {
  position: fixed;
  bottom: 24px;
  left: 28px;
  font-size: 10px;
  color: var(--muted);
  opacity: 0;
  transition: opacity 0.6s;
  font-family: var(--mono);
  letter-spacing: 0.06em;
}

/* ── DONE SCREEN ── */
#done-screen {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.8s ease;
  z-index: 200;
}
#done-screen.visible { opacity: 1; pointer-events: auto; }
#done-screen h1 {
  font-family: var(--sans);
  font-size: 15px;
  font-weight: 300;
  color: var(--muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 18px;
}
#done-screen .done-stat {
  font-family: var(--mono);
  font-size: 44px;
  color: var(--text);
  font-weight: 400;
  margin-bottom: 6px;
  letter-spacing: -0.02em;
}
#done-screen .done-sub {
  font-family: var(--sans);
  font-size: 13px;
  color: var(--muted);
  font-weight: 300;
}
</style>
</head>
<body>

<a id="wordmark" href="/">TheOddsAlgo <span>R Lab</span></a>
<div id="engineDot"></div>

<div id="stage">
  <div id="problem-wrap">
    <div id="problem-text"></div>
  </div>

  <div id="editor-wrap">
    <textarea id="editor" spellcheck="false"></textarea>
    <div class="editor-footer">
      <button id="runBtn" disabled>run</button>
      <span class="kb">ctrl+enter</span>
    </div>
  </div>

  <div id="output-area">
    <div id="output-line"></div>
    <div id="commentary-line"></div>
  </div>
</div>

<div id="hint-line">
  <button id="hint-toggle" onclick="toggleHint()">hint</button>
  <div id="hint-text"></div>
</div>
<div id="counter"></div>

<div id="cheat-panel" class="hidden"></div>
<div id="cheat-tab" onclick="toggleCheat()">‹</div>

<div id="ticker"><div id="ticker-track"></div></div>

<div id="done-screen">
  <h1>Complete</h1>
  <div class="done-stat" id="doneCount">47 / 47</div>
  <div class="done-sub">You are an Algo Architect.</div>
</div>

<script>
const TRIALS = [

  // ── LEVEL 0: SURVIVAL BASICS ─────────────────────────────────────────────
  {
    id:"0.1", level:0, levelName:"Survival Basics",
    concept:"c() — combine values into a vector",
    isl:"ISL §2.3.1",
    mission:"Five closing prices: 182, 175, 190, 168, 195. Store them in a vector named x.",
    hint:"c() combines values: c(a, b, c, ...). Assign the result to x using <-.",
    starter:"",
    validate(env) {
      const x = env.x;
      if (!Array.isArray(x)) return {pass:false, msg:"x isn't a vector — use c()"};
      if (x.length!==5) return {pass:false, msg:`x has ${x.length} elements, expected 5`};
      const exp=[182,175,190,168,195];
      for(let i=0;i<5;i++) if(Math.abs(x[i]-exp[i])>0.001) return {pass:false, msg:`x[${i+1}] = ${x[i]}, expected ${exp[i]}`};
      return {pass:true, msg:"x = [182, 175, 190, 168, 195] ✓"};
    }
  },
  {
    id:"0.2", level:0, levelName:"Survival Basics",
    concept:"length() — count elements",
    isl:"ISL §2.3.1",
    mission:"x holds five stock prices: 182, 175, 190, 168, 195. Print how many elements it contains.",
    hint:"length() returns the number of elements in a vector. Print the result — just type the expression.",
    starter:"",
    validate(env) {
      const out=String(env.__output||"").trim();
      if(out.includes("5")) return {pass:true, msg:"[1] 5 ✓"};
      return {pass:false, msg:`expected 5, got: ${out.slice(0,40)||"(nothing printed)"}`};
    }
  },
  {
    id:"0.3", level:0, levelName:"Survival Basics",
    concept:"matrix() — 2D data structure",
    isl:"ISL §2.3.1",
    mission:"Build a 2×2 matrix named m from these values: 0.05, -0.02, 0.08, 0.01. R fills by column.",
    hint:"matrix(data, nrow, ncol) — pass the values as c(...), then specify the shape.",
    starter:"",
    validate(env) {
      const m=env.m;
      if(!m) return {pass:false, msg:"m is not defined"};
      if(!m.__isMatrix) return {pass:false, msg:"m isn't a matrix — use matrix()"};
      if(m.nrow!==2||m.ncol!==2) return {pass:false, msg:`expected 2×2, got ${m.nrow}×${m.ncol}`};
      return {pass:true, msg:"2×2 matrix ✓"};
    }
  },
  {
    id:"0.4", level:0, levelName:"Survival Basics",
    concept:"sqrt() — vectorized math",
    isl:"ISL §2.3.1",
    mission:"x contains prices 182, 175, 190, 168, 195. Print the square root of each one.",
    hint:"R vectorizes math automatically — no loop needed. Just apply the function directly to x.",
    starter:"",
    validate(env) {
      const out=String(env.__output||"");
      if(out.includes("13.4")||out.includes("13.2")) return {pass:true, msg:"√182 ≈ 13.49 ✓"};
      return {pass:false, msg:"print sqrt(x) — type it as a bare expression"};
    }
  },

  // ── LEVEL 1: WORKING WITH NUMBERS ────────────────────────────────────────
  {
    id:"1.0", level:1, levelName:"Working With Numbers",
    concept:"ifelse() — vectorized conditional",
    isl:"Project Launch",
    mission:"American odds: -150, 200, -300, 110, -220. Convert to implied probability and store in prob.\n\nNegative odds: |odds| / (|odds| + 100)\nPositive odds: 100 / (odds + 100)",
    hint:"ifelse(condition, value_if_true, value_if_false) applies element-by-element. Test whether each odd is negative.",
    starter:"",
    validate(env) {
      const prob=env.prob;
      if(!Array.isArray(prob)) return {pass:false, msg:"prob should be a numeric vector"};
      if(prob.length!==5) return {pass:false, msg:`expected 5 values, got ${prob.length}`};
      const exp=[0.6,0.3333,0.75,0.4762,0.6875];
      for(let i=0;i<5;i++) if(Math.abs(prob[i]-exp[i])>0.02) return {pass:false, msg:`prob[${i+1}] ≈ ${prob[i].toFixed(3)}, expected ${exp[i].toFixed(3)}`};
      return {pass:true, msg:prob.map(p=>(p*100).toFixed(1)+"%").join("  ")};
    }
  },
  {
    id:"1.1", level:1, levelName:"Working With Numbers",
    concept:"mean() and sum() — aggregation",
    isl:"ISL §2.3.1",
    mission:"Daily returns: 0.012, -0.005, 0.023, -0.008, 0.015, 0.004, -0.011.\n\nStore the total return in total_return and the average daily return in avg_return.",
    hint:"sum() adds everything. mean() divides by count. Both take a vector.",
    starter:"",
    validate(env) {
      const tr=env.total_return, ar=env.avg_return;
      if(tr===undefined) return {pass:false, msg:"total_return is not defined"};
      if(ar===undefined) return {pass:false, msg:"avg_return is not defined"};
      const expSum=0.012-0.005+0.023-0.008+0.015+0.004-0.011;
      if(Math.abs((Array.isArray(tr)?tr[0]:tr)-expSum)>0.001) return {pass:false, msg:`total_return should be ~${expSum.toFixed(4)}`};
      return {pass:true, msg:`total: ${expSum.toFixed(4)}  avg: ${(expSum/7).toFixed(4)}`};
    }
  },
  {
    id:"1.2", level:1, levelName:"Working With Numbers",
    concept:"which.max() and which.min()",
    isl:"ISL §2.3.1",
    mission:"Returns: 0.031, -0.014, 0.087, -0.052, 0.019.\n\nStore the index of the highest return in best. Store the index of the lowest in worst.",
    hint:"which.max() and which.min() return the position, not the value itself.",
    starter:"",
    validate(env) {
      const b=Array.isArray(env.best)?env.best[0]:env.best;
      const w=Array.isArray(env.worst)?env.worst[0]:env.worst;
      if(b===undefined) return {pass:false, msg:"best is not defined"};
      if(w===undefined) return {pass:false, msg:"worst is not defined"};
      if(Math.abs(b-3)>0.01) return {pass:false, msg:`best should be 3, got ${b}`};
      if(Math.abs(w-4)>0.01) return {pass:false, msg:`worst should be 4, got ${w}`};
      return {pass:true, msg:"best = 3 (8.7%)  worst = 4 (-5.2%) ✓"};
    }
  },
  {
    id:"1.3", level:1, levelName:"Working With Numbers",
    concept:"Indexing — logical filters",
    isl:"ISL §2.3.2",
    mission:"Prices: 182, 94, 201, 145, 312, 88, 175. Extract only those above $150 and store in winners.",
    hint:"You can filter a vector by putting a condition inside brackets: x[x > 150].",
    starter:"",
    validate(env) {
      const w=env.winners;
      if(!Array.isArray(w)) return {pass:false, msg:"winners should be a vector"};
      if(w.length!==4) return {pass:false, msg:`expected 4 values above $150, got ${w.length}`};
      return {pass:true, msg:"winners = [182, 201, 312, 175] ✓"};
    }
  },
  {
    id:"1.4", level:1, levelName:"Working With Numbers",
    concept:"seq() — generate sequences",
    isl:"ISL §2.3.1",
    mission:"Generate price targets from $100 to $200 in steps of $10. Store in targets.",
    hint:"seq(from, to, by=step) — the step argument is named 'by'.",
    starter:"",
    validate(env) {
      const t=env.targets;
      if(!Array.isArray(t)) return {pass:false, msg:"targets should be a vector"};
      if(t.length!==11) return {pass:false, msg:`expected 11 values, got ${t.length}`};
      if(Math.abs(t[0]-100)>0.001) return {pass:false, msg:`first value should be 100, got ${t[0]}`};
      if(Math.abs(t[t.length-1]-200)>0.001) return {pass:false, msg:`last value should be 200, got ${t[t.length-1]}`};
      return {pass:true, msg:"100 110 120 … 200 ✓"};
    }
  },

  // ── LEVEL 2: DATA FRAMES ─────────────────────────────────────────────────
  {
    id:"2.0", level:2, levelName:"Data Frames",
    concept:"data.frame() — tabular data",
    isl:"ISL §2.3.3",
    mission:"Build a data frame named portfolio with three columns:\nticker: AAPL, TSLA, NVDA\nprice: 189, 245, 875\nshares: 10, 5, 2",
    hint:"data.frame(col1=c(...), col2=c(...)) — each column is a named vector. All must be the same length.",
    starter:"",
    validate(env) {
      const p=env.portfolio;
      if(!p) return {pass:false, msg:"portfolio is not defined"};
      if(!p.__isDF) return {pass:false, msg:"portfolio should be a data.frame"};
      if(p.nrow!==3) return {pass:false, msg:`expected 3 rows, got ${p.nrow}`};
      return {pass:true, msg:"3×3 portfolio ✓"};
    }
  },
  {
    id:"2.1", level:2, levelName:"Data Frames",
    concept:"$ operator — column access",
    isl:"ISL §2.3.3",
    mission:"portfolio has columns ticker, price, shares (AAPL/189/10, TSLA/245/5, NVDA/875/2).\n\nCompute total portfolio value and store it in port_value.",
    hint:"Access columns with $: portfolio$price. Multiply price × shares per stock, then sum.",
    starter:"",
    validate(env) {
      const pv=Array.isArray(env.port_value)?env.port_value[0]:env.port_value;
      if(pv===undefined) return {pass:false, msg:"port_value is not defined"};
      const exp=189*10+245*5+875*2;
      if(Math.abs(pv-exp)>0.5) return {pass:false, msg:`expected $${exp}, got $${pv}`};
      return {pass:true, msg:`$${exp.toLocaleString()} ✓`};
    }
  },
  {
    id:"2.2", level:2, levelName:"Data Frames",
    concept:"order() — sort a data frame",
    isl:"ISL §2.3.3",
    mission:"portfolio has columns ticker, price, shares (AAPL/189/10, TSLA/245/5, NVDA/875/2).\n\nSort it by price descending. Store the result in sorted_port.",
    hint:"order(-df$col) returns row indices sorted descending. Use those to reindex: df[order(...), ]",
    starter:"",
    validate(env) {
      const sp=env.sorted_port;
      if(!sp) return {pass:false, msg:"sorted_port is not defined"};
      if(!sp.__isDF) return {pass:false, msg:"sorted_port should be a data.frame"};
      return {pass:true, msg:"NVDA → TSLA → AAPL ✓"};
    }
  },
  {
    id:"2.3", level:2, levelName:"Data Frames",
    concept:"subset() — filter rows",
    isl:"ISL §2.3.3",
    mission:"portfolio has columns ticker, price, shares (AAPL/189/10, TSLA/245/5, NVDA/875/2).\n\nKeep only stocks priced above $200. Store in expensive.",
    hint:"subset(df, condition) — like a WHERE clause. Reference the column name directly.",
    starter:"",
    validate(env) {
      const e=env.expensive;
      if(!e) return {pass:false, msg:"expensive is not defined"};
      if(!e.__isDF) return {pass:false, msg:"expensive should be a data.frame"};
      if(e.nrow!==2) return {pass:false, msg:`expected 2 rows, got ${e.nrow}`};
      return {pass:true, msg:"TSLA, NVDA ✓"};
    }
  },
  {
    id:"2.4", level:2, levelName:"Data Frames",
    concept:"nrow() — inspect data",
    isl:"ISL §2.3.3",

// ── STATE ──────────────────────────────────────────────────────────────────
let completed  = new Set(JSON.parse(localStorage.getItem("rlab_done") || "[]"));
let xp         = parseInt(localStorage.getItem("rlab_xp") || "0");
let streak     = parseInt(localStorage.getItem("rlab_streak") || "0");
let lastDate   = localStorage.getItem("rlab_date") || "";
let current    = 0;
let failCount  = 0;
let hintOpen   = false;
let webrReady  = false;
let webr       = null;
let transitioning = false;

function save() {
  localStorage.setItem("rlab_done",   JSON.stringify([...completed]));
  localStorage.setItem("rlab_xp",     xp);
  localStorage.setItem("rlab_streak", streak);
  localStorage.setItem("rlab_date",   lastDate);
}

// ── STREAK ─────────────────────────────────────────────────────────────────
function touchStreak() {
  const today = new Date().toDateString();
  if (lastDate === today) return;
  const yesterday = new Date(Date.now() - 86400000).toDateString();
  streak = (lastDate === yesterday) ? streak + 1 : 1;
  lastDate = today;
  save();
}

// ── LOAD ───────────────────────────────────────────────────────────────────
function loadTrial(idx, animate) {
  current   = idx;
  failCount = 0;
  hintOpen  = false;
  failCount = 0;
  clearFlash();
  clearOutput();
  closeHint();
  document.getElementById('hint-line').classList.remove('visible');

  const t = TRIALS[idx];
  const pt = document.getElementById("problem-text");
  const ed = document.getElementById("editor");

  if (animate) {
    pt.classList.remove("visible");
    pt.classList.add("fading");
    setTimeout(() => {
      setQuestion(t, pt, ed);
      pt.classList.remove("fading");
      pt.classList.add("visible");
    }, 320);
  } else {
    setQuestion(t, pt, ed);
    setTimeout(() => pt.classList.add("visible"), 40);
  }

  // hide hint trigger until failures
  document.getElementById("hint-trigger").classList.remove("visible");
}

function setQuestion(t, pt, ed) {
  pt.textContent = t.mission;
  ed.value = t.starter || "";
  ed.style.height = "auto";
  autosize(ed);
}

function autosize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(Math.max(el.scrollHeight, 120), 260) + "px";
}

// ── KEYBOARD ───────────────────────────────────────────────────────────────
document.getElementById("editor").addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); runCode(); }
  if (e.key === "Tab") {
    e.preventDefault();
    const s = e.target.selectionStart, en = e.target.selectionEnd;
    e.target.value = e.target.value.slice(0, s) + "  " + e.target.value.slice(en);
    e.target.selectionStart = e.target.selectionEnd = s + 2;
  }
});
document.getElementById("editor").addEventListener("input", e => autosize(e.target));

// ── RUN ────────────────────────────────────────────────────────────────────
async function runCode() {
  if (transitioning) return;
  const code = document.getElementById("editor").value.trim();
  if (!code) return;
  const btn = document.getElementById("runBtn");
  btn.disabled = true; btn.classList.add("running"); btn.textContent = "…";
  try {
    if (webrReady && webr) await runReal(code);
    else await runSim(code);
  } finally {
    btn.disabled = false; btn.classList.remove("running"); btn.textContent = "run";
  }
}

async function runReal(code) {
  const trial = TRIALS[current];
  let outputText = "", envData = {}, errText = "";
  try {
    await webr.evalRVoid(code);
    try {
      const outR = await webr.evalR(`paste(capture.output({${code}}), collapse="\n")`);
      const outJs = await outR.toJs();
      outputText = (outJs.values || []).join("\n");
    } catch { outputText = ""; }

    const vars = ["x","m","prob","returns","total_return","avg_return","best","worst",
      "winners","targets","portfolio","sorted_port","expensive","vol","r",
      "model","predicted","r_squared","port_value","stocks","positive_days",
      "trimmed","ranked","avg_by_ticker","result","full_data",
      "gap","prices","changes","pct_returns","ma3","ma5","roll_vol","ac",
      "train","test","log_model","probs","predicted","conf_mat","arima_model",
      "fc","mae","rmse","tree_model","rf_model",
      "sharpe","max_dd","signals","kelly","half_kelly","score",
      "strat_final","bah_final","accuracy","strat","bah",
      "cum_ret","running_max","drawdown","sig"];
    for (const v of vars) {
      try {
        const existsJs = await (await webr.evalR(`exists("${v}")`)).toJs();
        if (!existsJs.values?.[0]) continue;
        const cls = ((await (await webr.evalR(`class(${v})[1]`)).toJs()).values || [])[0] || "";
        if (cls === "numeric" || cls === "integer" || cls === "logical") {
          envData[v] = (await (await webr.evalR(`as.numeric(${v})`)).toJs()).values;
        } else if (cls === "character") {
          envData[v] = (await (await webr.evalR(v)).toJs()).values;
        } else if (cls === "data.frame") {
          const nr = (await (await webr.evalR(`nrow(${v})`)).toJs()).values[0];
          const nc = (await (await webr.evalR(`ncol(${v})`)).toJs()).values[0];
          envData[v] = { __isDF: true, nrow: nr, ncol: nc };
        } else if (cls === "lm") {
          const r2 = (await (await webr.evalR(`summary(${v})$r.squared`)).toJs()).values;
          envData[v] = { __isLM: true };
          if (r2) envData.r_squared = r2;
        } else if (cls === "matrix" || cls === "array") {
          const nr = (await (await webr.evalR(`nrow(${v})`)).toJs()).values[0];
          const nc = (await (await webr.evalR(`ncol(${v})`)).toJs()).values[0];
          envData[v] = { __isMatrix: true, nrow: nr, ncol: nc };
        }
      } catch {}
    }
    envData.__output = outputText;
  } catch(e) { errText = e.message || String(e); }
  resolve(envData, errText, trial);
}

async function runSim(code) {
  const trial = TRIALS[current];
  let env = {}, outputText = "", errText = "";
  try { outputText = simulate(code, env); env.__output = outputText; }
  catch(e) { errText = e.message; }
  resolve(env, errText, trial);
}

// ── OUTPUT ─────────────────────────────────────────────────────────────────
function showOutput(text, isError) {
  const ol = document.getElementById("output-line");
  const cl = document.getElementById("commentary-line");
  ol.textContent = text || "";
  ol.className = "visible" + (isError ? " is-error" : "");
  cl.textContent = "";
  cl.className = "";
}

function clearOutput() {
  const ol = document.getElementById("output-line");
  const cl = document.getElementById("commentary-line");
  ol.textContent = "";
  ol.className = "";
  cl.textContent = "";
  cl.className = "";
}

function showCommentary(trialId) {
  const line = COMMENTARY[trialId];
  if (!line) return;
  const cl = document.getElementById("commentary-line");
  cl.textContent = line;
  // brief delay so it appears after the pass flash settles
  setTimeout(() => cl.classList.add("visible"), 100);
}

// ── RESOLVE ────────────────────────────────────────────────────────────────
function resolve(envData, errText, trial) {
  if (errText) {
    flash("fail");
    showOutput("error: " + errText.split("\n")[0], true);
    failCount++;
    maybeShowHint();
    return;
  }

  const verdict = trial.validate(envData);
  const rawOut = (envData.__output || "").trim();

  if (verdict.pass) {
    flash("pass");
    // show raw output briefly, then commentary
    if (rawOut) showOutput(rawOut, false);
    showCommentary(trial.id);
    const wasNew = !completed.has(trial.id);
    if (wasNew) { completed.add(trial.id); xp += 10; touchStreak(); save(); }
    transitioning = true;
    setTimeout(() => {
      transitioning = false;
      clearOutput();
      const nextIdx = current + 1;
      if (nextIdx < TRIALS.length) {
        loadTrial(nextIdx, true);
      } else {
        showDone();
      }
    }, 2200);
  } else {
    flash("fail");
    // on fail: show what they actually got
    const failMsg = rawOut || verdict.msg || "";
    showOutput(failMsg, false);
    failCount++;
    maybeShowHint();
  }
}

function flash(type) {
  const wrap = document.getElementById("editor-wrap");
  clearFlash();
  wrap.classList.add(type === "pass" ? "pass-flash" : "fail-flash");
  if (type === "fail") setTimeout(clearFlash, 600);
}
function clearFlash() {
  const wrap = document.getElementById("editor-wrap");
  wrap.classList.remove("pass-flash", "fail-flash");
}

function maybeShowHint() {
  if (failCount >= 3) {
    document.getElementById("hint-line").classList.add("visible");
  }
}

function toggleHint() {
  hintOpen = !hintOpen;
  const toggle = document.getElementById("hint-toggle");
  const text   = document.getElementById("hint-text");
  if (hintOpen) {
    text.textContent = TRIALS[current].hint;
    text.classList.add("open");
    toggle.classList.add("open");
    toggle.textContent = "hide hint";
  } else {
    closeHint();
  }
}

function closeHint() {
  hintOpen = false;
  document.getElementById("hint-text").classList.remove("open");
  document.getElementById("hint-toggle").classList.remove("open");
  document.getElementById("hint-toggle").textContent = "hint";
}

// ── SIMULATOR (full, from original) ───────────────────────────────────────
function simulate(code, env) {
  const lines = code.split("\n").filter(l => l.trim() && !l.trim().startsWith("#"));
  const out = [];
  for (const line of lines) {
    const tr = line.trim();
    if (tr.startsWith("library(")) { env.__tidyverse = true; continue; }
    const asgn = tr.match(/^(\w+)\s*<-\s*([\s\S]+)$/);
    if (asgn) { const [,name,expr] = asgn; env[name] = evalExpr(expr.trim(), env); continue; }
    if (tr.includes("|>")) { const v = evalPipe(tr, env); if (v !== undefined) out.push(formatVal(v)); continue; }
    const val = evalExpr(tr, env);
    if (val !== undefined) out.push(formatVal(val));
  }
  return out.join("\n");
}

function evalPipe(expr, env) {
  const steps = expr.split("|>").map(s => s.trim());
  let val = evalExpr(steps[0], env);
  for (let i = 1; i < steps.length; i++) {
    const fn = steps[i].trim();
    if (fn.startsWith("filter(")) { if (val&&val.__isDF) { const c = fn.slice(7,-1).trim(); if (c.includes("> 0")) val={...val,nrow:Math.ceil(val.nrow*0.6)}; else if (c.includes("> 200")) val={...val,nrow:2}; } }
    else if (fn.startsWith("arrange(")) { if (val&&val.__isDF) val={...val,__sorted:true}; }
    else if (fn.startsWith("select(")) { if (val&&val.__isDF) val={...val,ncol:2}; }
    else if (fn.startsWith("group_by(")) { if (val&&val.__isDF) val={...val,__grouped:true}; }
    else if (fn.startsWith("summarise(")||fn.startsWith("summarize(")) { if (val&&val.__isDF) val={...val,__grouped:false,nrow:2,ncol:2}; }
    else if (fn.startsWith("mutate(")) { if (val&&val.__isDF) val={...val,ncol:val.ncol+1}; }
  }
  return val;
}

function evalExpr(expr, env) {
  expr = expr.trim();
  if (expr.startsWith("(") && expr.endsWith(")")) expr = expr.slice(1,-1).trim();
  if (expr.includes("|>")) return evalPipe(expr, env);
  if (expr.startsWith("c(")) { const inner=expr.slice(2,-1); if(inner.includes('"')||inner.includes("'")) return inner.split(",").map(s=>s.trim().replace(/^["']|["']$/g,"")); return inner.split(",").map(n=>parseFloat(n.trim())).filter(n=>!isNaN(n)); }
  if (expr.startsWith("seq(")) { const args=expr.slice(4,-1).split(",").map(s=>s.trim()); const from=parseFloat(args[0]),to=parseFloat(args[1]); const byM=(args[2]||"").match(/by\s*=\s*([\d.]+)/); const by=byM?parseFloat(byM[1]):1; const r=[]; for(let v=from;v<=to+0.0001;v+=by) r.push(parseFloat(v.toFixed(10))); return r; }

  if (expr.startsWith("left_join(")||expr.startsWith("inner_join(")) { const args=expr.slice(expr.indexOf("(")+1,-1).split(","); const a=env[args[0].trim()],b=env[args[1].trim()]; return {__isDF:true,nrow:a?a.nrow:3,ncol:(a&&a.ncol?a.ncol:2)+(b&&b.ncol?b.ncol:2)-1}; }

  if (expr.startsWith("lm(")) return {__isLM:true};

function formatVal(val) {
  if (val === undefined || val === null) return "";
  if (typeof val === "string" && val.startsWith("__cat__:")) return val.slice(8);
  if (val === "__summary__") return "Coefficients:\n(Intercept)  volume\n   -0.01234  0.01854\n\nR-squared: 0.9711";
  if (val === "__tidyverse_logo__") return "tidyverse loaded";
  if (val === "__model_output__") return "Model output.";
  if (Array.isArray(val)) {
    if (!val.length) return "";
    if (typeof val[0] === "string") return "[1] " + val.map(s => `"${s}"`).join(" ");
    return "[1] " + val.map(v => v === null ? "NA" : typeof v === "number" ? (Number.isInteger(v) ? v : parseFloat(v.toFixed(6))) : v).join(" ");
  }
  if (val?.__isMatrix) return `     [,1] [,2]\n[1,]    1    3\n[2,]    2    4`;
  if (val?.__isDF) return `  ticker price shares\n1   AAPL   189     10\n2   TSLA   245      5\n3   NVDA   875      2`;
  if (val?.__isLM) return `Coefficients:\n(Intercept)  volume\n   -0.01234  0.01854`;
  if (val?.__isACF) return `Autocorrelations:\n  0      1      2\n1.000 -0.031  0.082`;
  if (val?.__isTable) return `predicted 0 1\n        0 1 1\n        1 0 6`;
  if (val?.__isArima) return `ar1=0.1823 intercept=0.0062`;
  if (val?.__isForecast) return `[1] 0.00412 0.00385 0.00401`;
  if (val?.__isTree) return `CP nsplit error\n0.333  0  1.000`;
  if (val?.__isRF) return `OOB error: 16.67%\nMeanDecreaseGini: volume=3.42`;
  if (val?.__isDate) return `[1] "2024-01-02"`;
  return String(val);
}

// ── WEBR ───────────────────────────────────────────────────────────────────
async function initWebR() {
  try {
    const { WebR } = await import("https://webr.r-wasm.org/latest/webr.mjs");
    webr = new WebR();
    await webr.init();
    if (!webr.evalRVoid) webr.evalRVoid = async(code) => { await webr.evalR(code); };
    const t = await webr.evalR("1+1");
    if ((await t.toJs()).values?.[0] !== 2) throw new Error("smoke test");
    webrReady = true;
    document.getElementById("engineDot").className = "ready";
    document.getElementById("runBtn").disabled = false;
  } catch(e) {
    console.warn("webR:", e.message);
    document.getElementById("engineDot").className = "err";
    document.getElementById("runBtn").disabled = false;
  }
}

// ── BOOT ───────────────────────────────────────────────────────────────────
// find first uncompleted trial
let startIdx = 0;
for (let i = 0; i < TRIALS.length; i++) {
  if (!completed.has(TRIALS[i].id)) { startIdx = i; break; }
  if (i === TRIALS.length - 1) startIdx = TRIALS.length - 1;
}

buildCheat();
buildTicker();
loadTrial(startIdx, false);
initWebR();
</script>
