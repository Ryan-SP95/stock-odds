<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Odds Algo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:           #080810;
  --surface:      #0e0e1c;
  --surface2:     #13132a;
  --border:       rgba(255,255,255,0.06);
  --border-active:rgba(255,255,255,0.14);
  --text:         #e8e8f0;
  --text-dim:     #6b6b88;
  --text-muted:   #3a3a52;
  --mono:         'DM Mono', monospace;
  --sans:         'Syne', sans-serif;
  --spy:  #4B8FD4;
  --qqq:  #7B6FD0;
  --dia:  #3AAFAD;
  --iwm:  #6B9EC8;
  --vix:  #C0504A;
}

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* subtle grid texture */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
  z-index: 0;
}

.page {
  position: relative;
  z-index: 1;
  max-width: 1020px;
  margin: 0 auto;
  padding: 36px 32px 56px;
}

/* ── Top bar ─────────────────────────────────────── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 36px;
}

.brand {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--text-dim);
  text-decoration: none;
  transition: color 0.2s;
}
.brand:hover { color: var(--text); }

.brand span {
  color: var(--spy);
}




/* ── Chart container ─────────────────────────────── */
.chart-wrap {
  position: relative;
  width: 100%;
  height: 380px;
  margin-bottom: 0;
}

canvas#chart {
  display: block;
  width: 100%;
  height: 100%;
}

/* ── Tooltip ─────────────────────────────────────── */
#tooltip {
  position: absolute;
  pointer-events: none;
  display: none;
  background: rgba(10,10,22,0.95);
  border: 0.5px solid var(--border-active);
  border-radius: 8px;
  padding: 10px 14px;
  min-width: 160px;
  backdrop-filter: blur(8px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
#tooltip .tt-time {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.12em;
  color: var(--text-muted);
  margin-bottom: 8px;
  text-transform: uppercase;
}
#tooltip .tt-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 4px;
}
#tooltip .tt-row:last-child { margin-bottom: 0; }
.tt-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
#tooltip .tt-name {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  color: var(--text-dim);
  flex: 1;
}
#tooltip .tt-vals {
  display: flex;
  gap: 8px;
  align-items: center;
}
#tooltip .tt-price {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-dim);
}
#tooltip .tt-pct {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  min-width: 52px;
  text-align: right;
}
#tooltip .tt-pct.pos { color: #22c55e; }
#tooltip .tt-pct.neg { color: #ef4444; }

/* ── Divider ─────────────────────────────────────── */
.divider {
  height: 0.5px;
  background: var(--border);
  margin: 20px 0;
}

/* ── Legend ──────────────────────────────────────── */
.legend {
  display: flex;
  justify-content: center;
  gap: 28px;
  flex-wrap: wrap;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  padding: 4px 0;
  transition: opacity 0.2s;
}
.legend-item.faded { opacity: 0.22; }

.legend-pip {
  width: 20px;
  height: 2px;
  border-radius: 1px;
  flex-shrink: 0;
}

.legend-name {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  text-transform: uppercase;
  transition: color 0.2s;
}
.legend-item:hover .legend-name { color: var(--text); }

/* ── Enter link ──────────────────────────────────── */
.enter-wrap {
  margin-top: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.enter-link {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-dim);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 20px;
  border: 0.5px solid var(--border);
  border-radius: 7px;
  transition: all 0.2s;
}
.enter-link:hover {
  color: var(--text);
  border-color: var(--border-active);
  background: var(--surface);
}
.enter-arrow {
  display: inline-block;
  transition: transform 0.2s;
}
.enter-link:hover .enter-arrow { transform: translateX(4px); }

/* ── Loading / error ─────────────────────────────── */
.state-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  pointer-events: none;
}
.state-overlay.hidden { display: none; }

.loader {
  width: 24px; height: 24px;
  border: 1.5px solid var(--border);
  border-top-color: var(--text-dim);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.err-msg {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-muted);
  text-align: center;
  line-height: 1.7;
}

/* ── Fade in ─────────────────────────────────────── */
.chart-wrap, .legend, .enter-wrap {
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.5s, transform 0.5s;
}
.chart-wrap.ready, .legend.ready, .enter-wrap.ready {
  opacity: 1;
  transform: translateY(0);
}
.legend.ready { transition-delay: 0.08s; }
.enter-wrap.ready { transition-delay: 0.14s; }

/* ── Mobile ──────────────────────────────────────── */
@media (max-width: 640px) {
  .page { padding: 20px 16px 40px; }
  .chart-wrap { height: 260px; }
  .legend { gap: 16px; }
  .topbar { margin-bottom: 24px; }
}
</style>
</head>
<body>

<div class="page">

  <div class="topbar">
    <a class="brand" href="/">THE ODDS<span>.</span>ALGO</a>

  </div>

  <div class="chart-wrap" id="chart-wrap">
    <canvas id="chart"></canvas>
    <div class="state-overlay" id="loading-state"><div class="loader"></div></div>
    <div class="state-overlay hidden" id="error-state">
      <div class="err-msg" id="error-msg">Could not load market data.<br>Please try again.</div>
    </div>
    <div id="tooltip">
      <div class="tt-time" id="tt-time">—</div>
      <div id="tt-rows"></div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="legend" id="legend">
    <div class="legend-item" data-ticker="SPY">
      <div class="legend-pip" style="background:var(--spy)"></div>
      <span class="legend-name">S&amp;P 500</span>
    </div>
  </div>

  <div class="enter-wrap" id="enter-wrap">
    <a class="enter-link" href="/app">Run The Odds <span class="enter-arrow">→</span></a>
  </div>

</div>

<script>
// ─── Config ──────────────────────────────────────────────────────────────────
const BACKEND = 'https://stock-odds-backend-production.up.railway.app';

const INDICES = [
  { ticker: 'SPY', cssVar: '--spy', color: '#4B8FD4' },
];


// ─── State ────────────────────────────────────────────────────────────────────
let activeRange   = 'year';
let isolatedTick  = null;
let allSeries     = {};   // { SPY: [{t,price,pct},...], ... }
let hoverX        = null;
let rafId         = null;

// ─── DOM ─────────────────────────────────────────────────────────────────────
const canvas     = document.getElementById('chart');
const ctx        = canvas.getContext('2d');
const tooltip    = document.getElementById('tooltip');
const ttTime     = document.getElementById('tt-time');
const ttRows     = document.getElementById('tt-rows');
const loadState  = document.getElementById('loading-state');
const errState   = document.getElementById('error-state');
const errMsg     = document.getElementById('error-msg');
const legendEl   = document.getElementById('legend');

// ─── Canvas scaling ───────────────────────────────────────────────────────────
function resizeCanvas() {
  const dpr  = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width        = rect.width  * dpr;
  canvas.height       = rect.height * dpr;
  canvas.style.width  = rect.width  + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.scale(dpr, dpr);
}

// ─── Fetch ────────────────────────────────────────────────────────────────────
async function fetchIndices(range) {
  showLoading(true);
  allSeries = {};

  try {
    const res = await fetch(`${BACKEND}/api/indices?range=${range}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();

    for (const [ticker, raw] of Object.entries(json)) {
      if (!Array.isArray(raw) || raw.length === 0) continue;
      const base = raw[0].price;
      allSeries[ticker] = raw.map(pt => ({
        t:     pt.t,
        price: pt.price,
        pct:   base > 0 ? ((pt.price - base) / base) * 100 : 0,
      }));
    }

    showLoading(false);
    revealUI();
    schedDraw();

  } catch (err) {
    console.error('Fetch error:', err);
    showError('Could not load market data.<br>Check connection and try again.');
  }
}

// ─── UI reveal ────────────────────────────────────────────────────────────────
function revealUI() {
  document.getElementById('chart-wrap').classList.add('ready');
  document.getElementById('legend').classList.add('ready');
  document.getElementById('enter-wrap').classList.add('ready');
}

// ─── Loading / error ──────────────────────────────────────────────────────────
function showLoading(on) {
  loadState.classList.toggle('hidden', !on);
  if (on) errState.classList.add('hidden');
}
function showError(msg) {
  errState.classList.remove('hidden');
  loadState.classList.add('hidden');
  errMsg.innerHTML = msg;
}

// ─── Draw ─────────────────────────────────────────────────────────────────────
const PAD = { top: 24, right: 24, bottom: 32, left: 58 };

function schedDraw(hX) {
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(() => draw(hX));
}

function draw(hX) {
  const dpr = window.devicePixelRatio || 1;
  const W   = canvas.width  / dpr;
  const H   = canvas.height / dpr;
  const cW  = W - PAD.left - PAD.right;
  const cH  = H - PAD.top  - PAD.bottom;

  ctx.clearRect(0, 0, W, H);

  if (Object.keys(allSeries).length === 0) return;

  // SPY only
  const primaryTickers = INDICES;
  const showVIX = false;

  // ── Compute Y scales ───────────────────────────────────
  let allPcts = [];
  for (const { ticker } of primaryTickers) {
    const s = allSeries[ticker];
    if (!s) continue;
    allPcts = allPcts.concat(s.map(p => p.pct));
  }

  if (allPcts.length === 0) return;

  const rawMin = Math.min(...allPcts);
  const rawMax = Math.max(...allPcts);
  const span   = rawMax - rawMin || 0.5;
  const pad    = span * 0.15;
  const yMin   = rawMin - pad;
  const yMax   = rawMax + pad;



  // Max data length for X axis
  let maxLen = 1;
  for (const { ticker } of INDICES) {
    const s = allSeries[ticker];
    if (s && s.length > maxLen) maxLen = s.length;
  }

  // ── Coordinate helpers ─────────────────────────────────
  function yPx(v)    { return PAD.top + (1 - (v - yMin)   / (yMax - yMin))   * cH; }
  function xPx(i, len) { return PAD.left + (i / Math.max(len - 1, 1)) * cW; }

  // ── Grid + Y labels ────────────────────────────────────
  ctx.save();
  const gridTicks = 5;
  for (let i = 0; i < gridTicks; i++) {
    const v  = yMin + (yMax - yMin) * (i / (gridTicks - 1));
    const py = yPx(v);

    // grid line
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth   = 0.5;
    ctx.moveTo(PAD.left, py);
    ctx.lineTo(W - PAD.right, py);
    ctx.stroke();

    // Left label (% change)
    const sign = v > 0 ? '+' : '';
    ctx.fillStyle    = '#3a3a52';
    ctx.font         = `400 9.5px 'DM Mono', monospace`;
    ctx.textAlign    = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText(sign + v.toFixed(1) + '%', PAD.left - 8, py);


  }

  // Zero line
  if (yMin < 0 && yMax > 0) {
    const zy = yPx(0);
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth   = 0.5;
    ctx.moveTo(PAD.left, zy);
    ctx.lineTo(W - PAD.right, zy);
    ctx.stroke();
  }
  ctx.restore();

  // ── X-axis labels ──────────────────────────────────────
  const refTicker = INDICES.find(i => allSeries[i.ticker])?.ticker;
  const refData   = refTicker ? allSeries[refTicker] : null;
  if (refData && refData.length > 1) {
    const xTicks = Math.min(6, refData.length);
    ctx.save();
    ctx.fillStyle    = '#3a3a52';
    ctx.font         = `400 9px 'DM Mono', monospace`;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'top';
    for (let i = 0; i < xTicks; i++) {
      const idx = Math.round(i / (xTicks - 1) * (refData.length - 1));
      const pt  = refData[idx];
      if (!pt) continue;
      const px = PAD.left + (idx / (refData.length - 1)) * cW;
      ctx.fillText(fmtTime(pt.t, activeRange), px, PAD.top + cH + 8);
    }
    ctx.restore();
  }

  // ── Draw series lines ──────────────────────────────────
  for (const { ticker, color } of INDICES) {
    const s = allSeries[ticker];
    if (!s || s.length < 2) continue;

    ctx.save();
    ctx.globalAlpha = 1;
    ctx.lineJoin    = 'round';
    ctx.lineCap     = 'round';
    ctx.strokeStyle = color;
    ctx.lineWidth   = 2;

    ctx.beginPath();
    s.forEach((pt, i) => {
      const px = xPx(i, s.length);
      const py = yPx(pt.pct);
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    });
    ctx.stroke();
    ctx.restore();
  }

  // ── Hover hairline + dots ──────────────────────────────
  if (hX != null) {
    const cx = Math.max(PAD.left, Math.min(W - PAD.right, hX));

    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth   = 0.5;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(cx, PAD.top);
    ctx.lineTo(cx, PAD.top + cH);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    const activeTickers = isolatedTick
      ? INDICES.filter(i => i.ticker === isolatedTick)
      : INDICES;

    for (const { ticker, color } of activeTickers) {
      const s = allSeries[ticker];
      if (!s || s.length < 2) continue;
      const relX  = (cx - PAD.left) / cW;
      const idx   = Math.min(Math.max(Math.round(relX * (s.length - 1)), 0), s.length - 1);
      const pt    = s[idx];
      if (!pt) continue;
      const px = xPx(idx, s.length);
      const py = yPx(pt.pct);

      ctx.save();
      ctx.beginPath();
      ctx.arc(px, py, 4, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth   = 1;
      ctx.stroke();
      ctx.restore();
    }
  }
}

// ─── Tooltip update ───────────────────────────────────────────────────────────
function updateTooltip(mouseX, mouseY) {
  const dpr = window.devicePixelRatio || 1;
  const W   = canvas.width / dpr;
  const cW  = W - PAD.left - PAD.right;
  const relX = (mouseX - PAD.left) / cW;

  if (relX < 0 || relX > 1) { tooltip.style.display = 'none'; return; }

  const activeTickers = isolatedTick
    ? INDICES.filter(i => i.ticker === isolatedTick)
    : INDICES;

  // Time label from first available series
  let timeLabel = '';
  for (const { ticker } of activeTickers) {
    const s = allSeries[ticker];
    if (!s || s.length < 2) continue;
    const idx = Math.min(Math.max(Math.round(relX * (s.length - 1)), 0), s.length - 1);
    timeLabel = fmtTime(s[idx].t, activeRange);
    break;
  }
  ttTime.textContent = timeLabel;
  ttRows.innerHTML = '';

  for (const { ticker, color } of activeTickers) {
    const s = allSeries[ticker];
    if (!s || s.length < 2) continue;
    const idx = Math.min(Math.max(Math.round(relX * (s.length - 1)), 0), s.length - 1);
    const pt  = s[idx];
    const pctCls = pt.pct >= 0 ? 'pos' : 'neg';

    const row = document.createElement('div');
    row.className = 'tt-row';
    row.innerHTML = `
      <div class="tt-dot" style="background:${color}"></div>
      <span class="tt-name">${ticker}</span>
      <div class="tt-vals">
        <span class="tt-price">$${pt.price.toFixed(2)}</span>
        <span class="tt-pct ${pctCls}">${pt.pct >= 0 ? '+' : ''}${pt.pct.toFixed(2)}%</span>
      </div>`;
    ttRows.appendChild(row);
  }

  // Position
  const wrapRect = canvas.parentElement.getBoundingClientRect();
  const ttW = 185, ttH = 28 + activeTickers.length * 24;
  let left = mouseX + 16, top = mouseY - 20;
  if (left + ttW > wrapRect.width)  left = mouseX - ttW - 16;
  if (top  + ttH > wrapRect.height) top  = mouseY - ttH;
  if (top < 0) top = 4;

  tooltip.style.left    = left + 'px';
  tooltip.style.top     = top  + 'px';
  tooltip.style.display = 'block';
}

// ─── Time formatting ──────────────────────────────────────────────────────────
function fmtTime(t, range) {
  const d = new Date(t);
  if (range === 'day')   return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
  if (range === 'month') return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  return d.toLocaleDateString([], { month: 'short', year: '2-digit' });
}

// ─── Mouse events ─────────────────────────────────────────────────────────────
function getPos(e) {
  const r = canvas.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : e;
  return { x: src.clientX - r.left, y: src.clientY - r.top };
}

canvas.addEventListener('mousemove', e => {
  const p = getPos(e);
  hoverX = p.x;
  schedDraw(hoverX);
  updateTooltip(p.x, p.y);
});
canvas.addEventListener('mouseleave', () => {
  hoverX = null;
  tooltip.style.display = 'none';
  schedDraw();
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const p = getPos(e);
  hoverX = p.x;
  schedDraw(hoverX);
  updateTooltip(p.x, p.y);
}, { passive: false });
canvas.addEventListener('touchend', () => {
  hoverX = null;
  tooltip.style.display = 'none';
  schedDraw();
});

// ─── Legend + stat bar isolation ──────────────────────────────────────────────
function setIsolation(ticker) {
  isolatedTick = isolatedTick === ticker ? null : ticker;

  document.querySelectorAll('.legend-item').forEach(el => {
    el.classList.toggle('faded', isolatedTick && el.dataset.ticker !== isolatedTick);
  });

  schedDraw(hoverX);
}

legendEl.addEventListener('click', e => {
  const item = e.target.closest('.legend-item');
  if (item) setIsolation(item.dataset.ticker);
});

});

// ─── Resize ───────────────────────────────────────────────────────────────────
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { resizeCanvas(); schedDraw(hoverX); }, 100);
});

// ─── Init ─────────────────────────────────────────────────────────────────────
resizeCanvas();
fetchIndices('year');
</script>
</body>
</html>
